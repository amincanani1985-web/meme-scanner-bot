name: meme scanner trading cycle

on:
  pull_request:
    paths:
      - "meme_scanner_cycle.py"
      - "memeswap_research.py"
      - "whale_copy_paper.py"
      - "paper_scenario_lab.py"
      - "tests/**"
      - "learn_agent.py"
      - "strategy_backtest.py"
      - "shadow_learning.py"
      - "shadow_path_backtest.py"
      - "scanner_simulator.py"
      - "whale_research.py"
      - "whale_behavior_lab.py"
      - "market_data_connectors.py"
      - "token_quality_screen.py"
      - "whale_follow_backtest.py"
      - "whale_shadow_capture.py"
      - "whale_event_study.py"
      - "dashboard/index.html"
      - ".github/workflows/trading-cycle.yml"
  push:
    branches: [main]
    paths:
      - "meme_scanner_cycle.py"
      - "memeswap_research.py"
      - "whale_copy_paper.py"
      - "paper_scenario_lab.py"
      - "tests/**"
      - "learn_agent.py"
      - "strategy_backtest.py"
      - "shadow_learning.py"
      - "shadow_path_backtest.py"
      - "scanner_simulator.py"
      - "whale_research.py"
      - "whale_behavior_lab.py"
      - "market_data_connectors.py"
      - "token_quality_screen.py"
      - "whale_follow_backtest.py"
      - "whale_shadow_capture.py"
      - "whale_event_study.py"
      - "dashboard/index.html"
      - ".github/workflows/trading-cycle.yml"
  # Keep periodic paper scans; push-triggered runs also kick off an immediate cycle.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  # Keep scheduled/push runs on main serialized together, but isolate each PR.
  # Otherwise a pending PR run can replace a pending main run in GitHub's single
  # pending slot and starve the periodic paper scanner of fresh observations.
  group: trading-cycle-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false

env:
  NOTIFY_ISSUE: "1"
  HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
  HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
  BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
  DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
  DUNE_SOLANA_TRADES_QUERY_ID: ${{ secrets.DUNE_SOLANA_TRADES_QUERY_ID }}
  NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
  SHADOW_PRICE_PATH_LOG: "${{ github.workspace }}/paper_account/shadow_price_paths.jsonl"
  # Optional read-only token risk profiles; no swap/transaction endpoint is used.
  MEMESWAP_RESEARCH_ENABLED: "1"

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # Pending runs must start from the latest main, not a stale push SHA.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Validate Python syntax
        run: python -m py_compile memeswap_research.py tests/test_memeswap_research.py meme_scanner_cycle.py whale_copy_paper.py paper_scenario_lab.py paper_position_monitor.py whale_monitor.py learn_agent.py strategy_backtest.py shadow_path_backtest.py scanner_simulator.py tests/test_scanner_simulator.py tests/test_scanner_logic.py tests/test_adaptive.py tests/test_whale_monitor.py tests/test_paper_position_monitor.py tests/test_workflow_safety.py tests/test_whale_copy_paper.py tests/test_shadow_path_backtest.py shadow_learning.py tests/test_shadow_learning.py whale_research.py tests/test_whale_research.py whale_behavior_lab.py tests/test_whale_behavior_lab.py market_data_connectors.py tests/test_market_data_connectors.py token_quality_screen.py tests/test_token_quality_screen.py whale_follow_backtest.py tests/test_whale_follow_backtest.py whale_shadow_capture.py tests/test_whale_shadow_capture.py whale_event_study.py tests/test_whale_event_study.py

      - name: Monitor existing paper positions with 30-second gaps
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for check in 1 2; do
            sleep 30
            echo "Monitor-only check $check/2"
            python paper_position_monitor.py
          done

      - name: Run scanner tests 10 times
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "=== TEST PASS $i/10 ==="
            python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/test.log
            grep -qE "Ran [0-9]+ tests" /tmp/test.log
          done

      - name: Run isolated paper scenario lab
        shell: bash
        run: |
          set -euo pipefail
          python paper_scenario_lab.py | tee /tmp/paper-scenario-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/paper-scenario-report.json").read_text(encoding="utf-8"))
          print("## Isolated paper scenario lab")
          print("- Mode: deterministic synthetic paths; not historical/live performance")
          print(f"- Closed scenarios: {report['closed_scenarios']}")
          print(f"- Unresolved scenarios: {report['unresolved_scenarios']}")
          print(f"- Combined net PnL across closed scenarios: ${report['combined_net_pnl_usd_for_closed_scenarios']:.6f} on separate $5 test positions")
          for name, result in report["scenarios"].items():
              pnl = "unresolved" if result["net_pnl_pct"] is None else f"{result['net_pnl_pct']:+.2f}%"
              print(f"- {name}: status={result['status']}, exit={result['reason'] or 'none'}, net={pnl}")
          PY

      - name: Report walk-forward strategy validation status
        shell: bash
        run: |
          set -euo pipefail
          python strategy_backtest.py | tee /tmp/backtest-report.json
          python shadow_learning.py | tee /tmp/shadow-learning-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          strategy = json.loads(Path("/tmp/backtest-report.json").read_text(encoding="utf-8"))
          shadow = json.loads(Path("/tmp/shadow-learning-report.json").read_text(encoding="utf-8"))
          report = {"strategy": strategy, "shadow": shadow}
          Path("dashboard/backtest-data.js").write_text("window.BACKTEST_REPORT=" + json.dumps(report, separators=(",", ":")) + ";\n", encoding="utf-8")
          PY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/backtest-report.json").read_text(encoding="utf-8"))
          status = report.get("status", "unknown")
          print("## Walk-forward strategy validation")
          print(f"- Status: **{status}**")
          print(f"- Scored observations: {report.get('rows', 0)}")
          print(f"- Eligible thresholds: {report.get('eligible_thresholds', [])}")
          if status != "ok":
              print("- **NOT VALIDATED:** insufficient clean out-of-sample data; this is not a strategy approval.")
          else:
              print("- Sample gates passed for at least one threshold. This is not a guarantee of profitability.")
          PY

      - name: Evaluate shadow outcomes on chronological holdout
        run: |
          set -euo pipefail
          python shadow_learning.py | tee /tmp/shadow-learning-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/shadow-learning-report.json").read_text(encoding="utf-8"))
          print("## Shadow learning research (not live strategy approval)")
          print(f"- Status: **{report.get('status', 'unknown')}**")
          print(f"- Labeled shadow outcomes: {report.get('rows', 0)}")
          print(f"- Chronological holdout: {report.get('validation_rows', 0)}")
          print(f"- Research-only candidate buckets: {[r['score_bucket'] for r in report.get('recommendations', [])]}")
          print("- Shadow observations never change the live entry threshold automatically.")
          for label, metrics in report.get("buckets", {}).items():
              print(f"- Score {label}: n={metrics['n']}, win rate={metrics['win_rate']:.1%}, median={metrics['median_pnl']:.2f}%, robust mean={metrics['robust_mean_pnl']:.2f}%, outliers={metrics['outlier_count']}")
          PY

      - name: Observe whale wallet behavior (research only)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python whale_research.py | tee /tmp/whale-research-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/whale-research-report.json").read_text(encoding="utf-8"))
          print("## Whale wallet behavior (research only)")
          print(f"- Status: {report.get('status', 'unknown')}")
          print(f"- Candidate tokens inspected: {report.get('scanned', 0)}")
          print(f"- Holder snapshots updated: {report.get('snapshots_updated', 0)}")
          print(f"- Observed holder-balance drops: {report.get('events', 0)}")
          print(f"- Drops with market sell-pressure confirmation: {report.get('confirmed_events', 0)}")
          print(f"- Observed holder-balance increases: {report.get('accumulation_events', 0)}")
          print(f"- Increases with market buy-pressure confirmation: {report.get('confirmed_accumulations', 0)}")
          print(f"- Wallets with tracked events: {report.get('tracked_wallets', 0)}")
          for wallet in report.get("top_wallets", []):
              print(f"- Sell-side wallet {wallet['owner']}: confirmed={wallet['confirmed_sell_pressure_events']}, observed={wallet['observed_drops']}, tokens={wallet['tokens_seen']}")
          for wallet in report.get("top_accumulators", []):
              print(f"- Buy-side candidate {wallet['owner']}: confirmed={wallet['confirmed_buy_pressure_events']}, observed={wallet['observed_increases']}, tokens={wallet['tokens_seen']}")
          print("- These are balance-change heuristics, not verified swaps or proof of wallet profitability.")
          PY

      - name: Run transaction-level whale-copy paper research
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python whale_copy_paper.py | tee /tmp/whale-copy-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/whale-copy-report.json").read_text(encoding="utf-8"))
          paper = report.get("paper_account", {})
          print("## Transaction-level whale-copy paper research")
          print(f"- Status: **{report.get('status', 'unknown')}**")
          print(f"- Wallets attempted / selected / tracked: {report.get('wallets_attempted', 0)} / {report.get('wallets_selected', 0)} / {report.get('wallets_tracked', 0)}")
          print(f"- Rate-limit backoff remaining: {report.get('api_backoff_seconds_remaining', 0)} seconds")
          print(f"- Fetch error categories: {report.get('fetch_error_reasons', {})}")
          print(f"- Swap transactions parsed this cycle: {report.get('swaps_seen', 0)}")
          print(f"- Newly closed wallet trades reconstructed: {report.get('new_closed_wallet_trades', 0)}")
          print(f"- Wallets qualifying on realized history: {report.get('qualifying_wallets', 0)}")
          print(f"- Fresh qualifying buys / sells: {report.get('fresh_profitable_wallet_buys', 0)} / {report.get('fresh_wallet_sells', 0)}")
          print(f"- Separate copy-paper equity: ${paper.get('equity', 0):.2f}")
          print(f"- Copy-paper closed trades / wins: {paper.get('closed_trades', 0)} / {paper.get('wins', 0)}")
          print(f"- Copy-paper net PnL: ${paper.get('net_pnl_usd', 0):+.4f}")
          print(f"- Copy-paper open positions: {paper.get('open_positions', 0)}")
          print(f"- Entry rejections: {paper.get('entry_rejections', {})}")
          print("- Realized wallet history is required; balance drops alone never qualify a wallet. The follower only trades in its own paper account.")
          for wallet in report.get("leaderboard", []):
              print(f"- Wallet {wallet['owner']}: closed={wallet['closed_trades']}, win rate={wallet['win_rate']:.1%}, PF={wallet['profit_factor']:.2f}, mean net={wallet['mean_net_pnl_pct']:+.2f}%, qualified={wallet['qualified']}")
          PY

      - name: Analyze observed whale behaviour and token consensus (research only)
        shell: bash
        run: |
          set -euo pipefail
          python whale_behavior_lab.py --swaps whale_copy_state.json --balances whale_watch_state.json --output /tmp/whale-behavior-report.json | tee /tmp/whale-behavior-report.stdout.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/whale-behavior-report.json").read_text(encoding="utf-8"))
          stats = report.get("statistics", {})
          print("## Tracked whale behaviour patterns (research only)")
          print(f"- Status: **{report.get('status', 'unknown')}**")
          print(f"- Valid swaps / observed wallets / tokens: {stats.get('swap_events_used', 0)} / {stats.get('wallets_with_valid_swaps', 0)} / {stats.get('tokens_with_observed_swaps', 0)}")
          print(f"- Complete wallet histories: {stats.get('wallets_with_complete_history', 0)}")
          print(f"- Wallets with realised outcomes / passing paper-copy gates: {stats.get('wallets_with_realized_outcomes', 0)} / {stats.get('wallets_meeting_copy_paper_gates', 0)}")
          print(f"- Multi-wallet buy consensus / distribution tokens: {stats.get('multi_wallet_buy_consensus_tokens', 0)} / {stats.get('multi_wallet_distribution_tokens', 0)}")
          print(f"- Malformed or unsupported events ignored: {stats.get('rejected_malformed_or_unsupported_events', 0)}")
          for wallet in report.get("wallet_profiles", [])[:10]:
              print(f"- Wallet {wallet['wallet'][:8]}…: style={wallet['observed_style']}, confidence={wallet['confidence']}, swaps={wallet['swap_count']}, leader/follower={wallet['observed_leader_count']}/{wallet['observed_follower_count']}, copy-paper-qualified={wallet['copy_paper_qualified']}")
          for token in report.get("token_flows", [])[:10]:
              print(f"- Token {token['mint'][:8]}…: flow={token['flow_label']}, recent unique buyers/sellers={token['latest_window_unique_buyers']}/{token['latest_window_unique_sellers']}, crowding-risk={token['crowding_risk']}")
          print("- Observed leadership is relative to monitored histories; these labels never authorize trades or change strategy thresholds.")
          PY

      - name: Collect multi-provider market evidence (read-only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python market_data_connectors.py --swaps whale_copy_state.json --balances whale_watch_state.json --public-only --output /tmp/market-data-connectors-report.json | tee /tmp/market-data-connectors-summary.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/market-data-connectors-report.json").read_text(encoding="utf-8"))
          print("## Public DEX market data (free, read-only)")
          print(f"- Solana mints checked: {len(report.get('mints_requested', []))}")
          for provider in report.get("provider_status", []):
              print(f"- {provider['provider']}: **{provider['status']}**; records={len(provider.get('records', []))}; error={provider.get('error') or 'none'}")
              if provider.get("note"):
                  print(f"  - {provider['note']}")
          print("- Optional providers are disabled in this step. No signal, strategy update, or live trade is authorized.")
          PY

      - name: Collect optional market-provider evidence (read-only)
        if: github.event_name != 'pull_request' && vars.MARKET_DATA_CONNECTORS_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python market_data_connectors.py --swaps whale_copy_state.json --balances whale_watch_state.json --optional-only --output /tmp/market-data-optional-connectors-report.json | tee /tmp/market-data-optional-connectors-summary.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/market-data-optional-connectors-report.json").read_text(encoding="utf-8"))
          print("## Optional market providers (read-only)")
          for provider in report.get("provider_status", []):
              if provider.get("provider") != "dexscreener":
                  print("- {}: **{}**; records={}; error={}".format(provider["provider"], provider["status"], len(provider.get("records", [])), provider.get("error") or "none"))
          print("- This step runs only when MARKET_DATA_CONNECTORS_ENABLED=true; paid API usage can occur.")
          PY

      - name: Screen observed DEX pools for research risk flags
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python token_quality_screen.py --input /tmp/market-data-connectors-report.json --output /tmp/token-quality-screen-report.json | tee /tmp/token-quality-screen-summary.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/token-quality-screen-report.json").read_text(encoding="utf-8"))
          print("## Token liquidity / volatility screen (research only)")
          print("- Status: **{}**; pools screened={}".format(report.get("status", "unknown"), report.get("pairs_screened", 0)))
          print("- Risk levels: {}".format(report.get("risk_level_counts", {})))
          for pair in report.get("pairs", [])[:8]:
              symbol = pair.get("token_symbol") or pair.get("token_name") or pair.get("mint") or "unknown"
              liquidity = pair.get("liquidity_usd")
              liquidity_text = "n/a" if liquidity is None else "${:,.0f}".format(liquidity)
              change = pair.get("price_change_h24_pct")
              change_text = "n/a" if change is None else "{:+.1f}%".format(change)
              flags = ", ".join(flag.get("code", "") for flag in pair.get("flags", [])) or "no configured flags"
              print("- {}: risk={} ({}/100), liquidity={}, 24h={}, flags={}".format(symbol, pair.get("risk_level"), pair.get("risk_score"), liquidity_text, change_text, flags))
          print("- Boost counts never lower risk. This screen is not a rug detector or trading signal; entries remain disabled.")
          PY
      - name: Smoke-test whale-follow replay on repository data (PR only, research only)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python whale_follow_backtest.py --paths paper_account/whale_quote_paths.jsonl paper_account/shadow_price_paths.jsonl --swaps whale_copy_state.json --output /tmp/whale-follow-backtest-report.json
          python whale_event_study.py --paths paper_account/whale_quote_paths.jsonl paper_account/shadow_price_paths.jsonl --swaps whale_copy_state.json --output /tmp/whale-event-study-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/whale-follow-backtest-report.json").read_text(encoding="utf-8"))
          print("## Whale-follow replay smoke test (offline, research only)")
          print(f"- Status: **{report.get('status', 'unknown')}**")
          print(f"- Usable paths / train / holdout: {report.get('usable_paths', 0)} / {report.get('train_paths', 0)} / {report.get('holdout_paths', 0)}")
          print(f"- Wallet swaps / matched path mints: {report.get('wallet_swap_events', 0)} / {report.get('paths_sharing_mints_with_wallet_swaps', 0)}")
          print(f"- Eligible training candidates: {report.get('eligible_training_candidates', 0)}")
          print("- Live trading is disabled; this step reads stored snapshots only.")
          event = json.loads(Path("/tmp/whale-event-study-report.json").read_text(encoding="utf-8"))
          print("- Whale event study: status={}, matched mints={}, event observations={}".format(event.get("status"), event.get("matched_mints", 0), event.get("event_observations", 0)))
          PY

      - name: Validate paper-trade target integrity
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          state_path = Path("paper_account/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          trades = int(state.get("trade_count", 0))
          assert 0 <= trades <= 200, f"invalid independent paper trade_count: {trades}"
          ledger_path = Path("paper_account/trades_log.csv")
          rows = []
          if ledger_path.exists() and ledger_path.stat().st_size:
              with ledger_path.open(newline="", encoding="utf-8") as handle:
                  rows = [row for row in csv.DictReader(handle) if row.get("timestamp") and row.get("mint")]
          wins = 0
          net_pnl = 0.0
          for row in rows:
              try:
                  pnl = float(row.get("pnl_usd", ""))
              except (TypeError, ValueError):
                  continue
              net_pnl += pnl
              wins += pnl > 0
          print(f"Independent paper-trade progress: {trades}/200")
          print("Independent ledger: {} closed trades, {} profitable, net PnL=${:.6f}".format(len(rows), wins, net_pnl))
          print("The 200-trade target uses only the isolated paper account; no synthetic trades are generated.")
          PY

      - name: Apply bounded adaptive strategy update to isolated paper account
        if: github.event_name != 'pull_request'
        run: python learn_agent.py --state paper_account/state.json --observations paper_account/strategy_observations.csv --apply

      - name: Run one discovery and entry cycle
        if: github.event_name != 'pull_request'
        working-directory: paper_account
        run: python ../meme_scanner_cycle.py

      - name: Monitor newly opened paper positions immediately
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Reallocate the monitor budget to the freshly opened positions:
          # the pre-scan pass is shorter, while new entries get 4 minutes of
          # real quotes sampled every 30 seconds before the cycle finishes.
          for check in 1 2 3 4 5 6 7 8; do
            sleep 30
            echo "Immediate post-entry check $check/8"
            python paper_position_monitor.py
          done

      # Recompute after entry and immediate monitoring so the dashboard includes outcomes closed in this same cycle.
      - name: Refresh learning reports after the latest outcomes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python strategy_backtest.py > /tmp/backtest-report-fresh.json
          python shadow_learning.py > /tmp/shadow-learning-report-fresh.json
          python strategy_backtest.py --observations paper_account/strategy_observations.csv > /tmp/paper-backtest-report.json
          python strategy_backtest.py --observations paper_account/whale_strategy_observations.csv > /tmp/paper-whale-backtest-report.json
          python shadow_learning.py --observations paper_account/shadow_observations.csv > /tmp/paper-shadow-learning-report.json
          python scanner_simulator.py --paths paper_account/shadow_price_paths.jsonl --output /tmp/paper-simulator-report.json
          python whale_follow_backtest.py --paths paper_account/whale_quote_paths.jsonl paper_account/shadow_price_paths.jsonl --swaps whale_copy_state.json --output /tmp/whale-follow-backtest-report.json
          python whale_event_study.py --paths paper_account/whale_quote_paths.jsonl paper_account/shadow_price_paths.jsonl --swaps whale_copy_state.json --output /tmp/whale-event-study-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          strategy = json.loads(Path("/tmp/backtest-report-fresh.json").read_text(encoding="utf-8"))
          shadow = json.loads(Path("/tmp/shadow-learning-report-fresh.json").read_text(encoding="utf-8"))
          paper_strategy = json.loads(Path("/tmp/paper-backtest-report.json").read_text(encoding="utf-8"))
          paper_whale_strategy = json.loads(Path("/tmp/paper-whale-backtest-report.json").read_text(encoding="utf-8"))
          paper_shadow = json.loads(Path("/tmp/paper-shadow-learning-report.json").read_text(encoding="utf-8"))
          paper_simulator = json.loads(Path("/tmp/paper-simulator-report.json").read_text(encoding="utf-8"))
          paper_whale_follow_backtest = json.loads(Path("/tmp/whale-follow-backtest-report.json").read_text(encoding="utf-8"))
          paper_whale_event_study = json.loads(Path("/tmp/whale-event-study-report.json").read_text(encoding="utf-8"))
          market_data_path = Path("/tmp/market-data-connectors-report.json")
          market_data_sources = (
              json.loads(market_data_path.read_text(encoding="utf-8"))
              if market_data_path.exists()
              else {
                  "status": "not_run_or_disabled",
                  "research_only": True,
                  "live_trading_authorized": False,
                  "provider_status": [],
                  "records": [],
              }
          )
          optional_market_data_path = Path("/tmp/market-data-optional-connectors-report.json")
          if optional_market_data_path.exists():
              optional_market_data = json.loads(optional_market_data_path.read_text(encoding="utf-8"))
              provider_map = {item.get("provider"): item for item in market_data_sources.get("provider_status", []) if item.get("provider") != "dexscreener"}
              for item in optional_market_data.get("provider_status", []):
                  if item.get("provider") != "dexscreener":
                      provider_map[item.get("provider")] = item
              dex_status = [item for item in market_data_sources.get("provider_status", []) if item.get("provider") == "dexscreener"]
              market_data_sources["provider_status"] = dex_status + list(provider_map.values())
              market_data_sources["records"] = market_data_sources.get("records", []) + optional_market_data.get("records", [])
              market_data_sources["optional_provider_report_generated_at"] = optional_market_data.get("generated_at")
          quality_path = Path("/tmp/token-quality-screen-report.json")
          token_quality_screen = (
              json.loads(quality_path.read_text(encoding="utf-8")) if quality_path.exists()
              else {"status": "not_run_or_disabled", "pairs_screened": 0, "pairs": [], "research_only": True, "trade_signal": False, "live_trading_authorized": False}
          )
          behavior_path = Path("/tmp/whale-behavior-report.json")
          paper_whale_behavior = (
              json.loads(behavior_path.read_text(encoding="utf-8"))
              if behavior_path.exists()
              else {
                  "status": "not_run_or_disabled",
                  "research_only": True,
                  "live_trading_authorized": False,
                  "copy_policy_changed": False,
                  "statistics": {},
                  "wallet_profiles": [],
                  "token_flows": [],
              }
          )
          report = {
              "strategy": strategy,
              "shadow": shadow,
              "paper_strategy": paper_strategy,
              "paper_whale_strategy": paper_whale_strategy,
              "paper_shadow": paper_shadow,
              "paper_simulator": paper_simulator,
              "paper_whale_behavior": paper_whale_behavior,
              "market_data_sources": market_data_sources,
              "token_quality_screen": token_quality_screen,
              "paper_whale_follow_backtest": paper_whale_follow_backtest,
              "paper_whale_event_study": paper_whale_event_study,
          }
          Path("dashboard/backtest-data.js").write_text(
              "window.BACKTEST_REPORT=" + json.dumps(report, separators=(",", ":")) + ";\n",
              encoding="utf-8",
          )
          print(
              f"Refreshed dashboard: historical strategy={strategy.get('rows', 0)} rows, "
              f"historical shadow={shadow.get('rows', 0)} rows, "
              f"paper strategy={paper_strategy.get('rows', 0)} rows, "
              f"paper whale experiment={paper_whale_strategy.get('rows', 0)} rows, "
              f"paper shadow={paper_shadow.get('rows', 0)} rows."
          )
          PY

      - name: Summarize whale-follow walk-forward results (research only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/whale-follow-backtest-report.json").read_text(encoding="utf-8"))
          print("## Delayed whale-follow walk-forward backtest (research only)")
          print(f"- Status: **{report.get('status', 'unknown')}**")
          print(f"- Usable quote paths / training / holdout: {report.get('usable_paths', 0)} / {report.get('train_paths', 0)} / {report.get('holdout_paths', 0)}")
          print(f"- Recorded wallet swaps / unique wallet-token sets: {report.get('wallet_swap_events', 0)} / {report.get('unique_wallet_tokens_with_swaps', 0)}")
          print(f"- Quote paths matching tracked-wallet token mints: {report.get('paths_sharing_mints_with_wallet_swaps', 0)}")
          print(f"- Eligible training rules: {report.get('eligible_training_candidates', 0)}")
          for candidate in report.get("candidates", []):
              training = candidate.get("training", {})
              holdout = candidate.get("holdout", {})
              print(
                  f"- {candidate.get('signal_mode')} delay={candidate.get('delay_seconds')}s: "
                  f"train n={training.get('n', 0)}, mean={training.get('mean_pnl_pct', 0):+.2f}%, PF={training.get('profit_factor', 0):.2f}; "
                  f"holdout n={holdout.get('n', 0)}, mean={holdout.get('mean_pnl_pct', 0):+.2f}%, "
                  f"return={candidate.get('holdout_portfolio', {}).get('return_pct', 0):+.2f}%, "
                  f"validated={candidate.get('validated', False)}"
              )
          if report.get("status") != "validated_profitable_out_of_sample":
              print("- **NOT VALIDATED:** no delayed whale-follow rule has passed all net-profit training and untouched holdout gates.")
          print("- Only recorded DEX quotes are used. Wallet qualification uses realized swap history before each signal. This step cannot authorize live trading.")
          PY

      - name: Summarize whale event-response study (research only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/whale-event-study-report.json").read_text(encoding="utf-8"))
          print("## Directional response after observed whale swaps (research only)")
          print(f"- Status: **{report.get('status', 'unknown')}**")
          print(f"- Quote paths: {report.get('usable_paths', 0)} usable / {report.get('paths_received', 0)} received")
          print(f"- Paths with buy / sell events: {report.get('paths_with_buy_events', 0)} / {report.get('paths_with_sell_events', 0)}")
          print(f"- Matched mints / event observations: {report.get('matched_mints', 0)} / {report.get('event_observations', 0)}")
          print(f"- Train / holdout paths: {report.get('train_matched_paths', 0)} / {report.get('holdout_matched_paths', 0)} matched")
          for group in report.get("groups", []):
              if group.get("delay_seconds") == 0 and group.get("horizon_seconds") in (60, 300, 600):
                  print("- {} {} {} at {}s: n={}, directional mean={:+.2f}%, median={:+.2f}%, positive={:.1%}".format(
                      group["partition"], group["side"], group["signal_class"], group["horizon_seconds"],
                      group["n"], group["mean_directional_return_pct"], group["median_directional_return_pct"],
                      group["directional_win_rate"]))
          print("- Directional responses are price movement, not net executable PnL; no strategy is selected or approved.")
          PY

      - name: Backtest sampled shadow exit paths (research only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python shadow_path_backtest.py --paths paper_account/shadow_price_paths.jsonl | tee /tmp/shadow-path-backtest-report.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/shadow-path-backtest-report.json").read_text(encoding="utf-8"))
          Path("dashboard/exit-path-backtest-data.js").write_text(
              "window.EXIT_PATH_BACKTEST=" + json.dumps(report, separators=(",", ":"), allow_nan=False) + ";\n",
              encoding="utf-8",
          )
          print("## Sampled quote-path exit backtest")
          print("- Data: recorded paper quotes only; no synthetic candles or prices.")
          print(f"- Status: **{report.get('status', 'unknown')}**")
          print(f"- Paths received / usable: {report.get('paths_received', 0)} / {report.get('usable_paths', 0)}")
          print(f"- Chronological train / holdout: {report.get('train_rows', 0)} / {report.get('validation_rows', 0)}")
          consistency = report.get("baseline_consistency", {})
          print(f"- Baseline replay matches: {consistency.get('matches', 0)} / {consistency.get('checked', 0)}")
          if report.get("selected_config") is not None:
              print(f"- Selected training-only rule: {report['selected_config']}")
              print(f"- Training metrics: {report.get('training', {})}")
              print(f"- Untouched holdout metrics: {report.get('holdout', {})}")
          if report.get("status") != "validated_profitable_out_of_sample":
              print("- **NOT VALIDATED:** no exit rule has passed the complete net-profitable holdout gates.")
          PY

      - name: Commit updated state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("state.json").read_text())
          csv = Path("trades_log.csv").read_text() if Path("trades_log.csv").exists() else ""
          paper_path = Path("paper_account/state.json")
          paper_state = json.loads(paper_path.read_text()) if paper_path.exists() else {}
          paper_csv_path = Path("paper_account/trades_log.csv")
          paper_csv = paper_csv_path.read_text() if paper_csv_path.exists() else ""
          whale_path = Path("whale_copy_account/state.json")
          whale_state = json.loads(whale_path.read_text()) if whale_path.exists() else {}
          whale_csv_path = Path("whale_copy_account/trades_log.csv")
          whale_csv = whale_csv_path.read_text() if whale_csv_path.exists() else ""
          Path("dashboard/live-data.js").write_text(
              "window.LIVE_STATE=" + json.dumps(state, separators=(",", ":")) + ";\n"
              "window.LIVE_CSV=" + json.dumps(csv) + ";\n"
              "window.PAPER_STATE=" + json.dumps(paper_state, separators=(",", ":")) + ";\n"
              "window.PAPER_CSV=" + json.dumps(paper_csv) + ";\n"
              "window.WHALE_COPY_STATE=" + json.dumps(whale_state, separators=(",", ":")) + ";\n"
              "window.WHALE_COPY_CSV=" + json.dumps(whale_csv) + ";\n",
              encoding="utf-8",
          )
          PY

          git add state.json dashboard/live-data.js dashboard/backtest-data.js learn_agent.py strategy_backtest.py dashboard/exit-path-backtest-data.js
          if [ -d paper_account ]; then git add paper_account/; fi
          if [ -f trades_log.csv ]; then git add trades_log.csv; fi
          if [ -f strategy_observations.csv ]; then git add strategy_observations.csv; fi
          if [ -f shadow_observations.csv ]; then git add shadow_observations.csv; fi
          if [ -f whale_watch_state.json ]; then git add whale_watch_state.json; fi
          if [ -f whale_events.csv ]; then git add whale_events.csv; fi
          if [ -f whale_copy_state.json ]; then git add whale_copy_state.json; fi
          if [ -f shadow_price_paths.jsonl ]; then git add shadow_price_paths.jsonl; fi
          if [ -f paper_account/shadow_price_paths.jsonl ]; then git add paper_account/shadow_price_paths.jsonl; fi
          if [ -d whale_copy_account ]; then git add whale_copy_account/; fi

          if git diff --staged --quiet; then
            echo "No state changes to commit"
            exit 0
          fi

          git commit -m "cycle update: $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Dashboard/source edits can land while this cycle is running. Rebase and
          # retry a bounded number of times instead of losing the scan heartbeat.
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict on attempt $attempt; aborting so we never overwrite remote state." >&2
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push race on attempt $attempt/5; retrying after fetching latest main."
            sleep "$attempt"
          done
          if [ "$pushed" != true ]; then
            echo "Could not publish cycle state after 5 attempts." >&2
            exit 1
          fi

      - name: Write cycle summary
        if: success() && github.event_name != 'pull_request'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          state = json.loads(Path("state.json").read_text(encoding="utf-8"))
          risk = state.get("risk_control", {})
          print("## Paper-trading cycle")
          print(f"- Last cycle: {state.get('last_run', 'unknown')}")
          print(f"- Scans: {state.get('scan_count', 0)}")
          print(f"- Closed trades: {state.get('trade_count', 0)}/200")
          print(f"- Paper equity: ${float(state.get('equity', 0)):.2f}")
          print(f"- Risk guard: {risk.get('status', 'unknown')} ({risk.get('drawdown_pct', 'n/a')}% peak drawdown)")
          strategy = state.get("strategy", {})
          validation = strategy.get("validation_status", "insufficient_history")
          print(f"- Strategy validation: {validation} ({strategy.get('history_rows', 0)}/{strategy.get('required_rows', 30)} scored observations)")
          if validation != "validated":
              print("- Strategy profitability is not validated; no threshold change is approved by the current evidence.")
          learning = state.get("learning", {})
          print(f"- Ledger reconciliation: {learning.get('trades', 0)} trades, {learning.get('wins', 0)} wins; {learning.get('unbucketed_trades', 0)} trades lack recoverable score-bucket data.")
          if risk.get("status") == "halted":
              print("- New account entries are blocked by the drawdown circuit breaker.")
              shadow = state.get("shadow_scan_diagnostics", {})
              print(f"- Shadow scan: {shadow.get('candidate_count', 0)} candidates; {shadow.get('filter_passed', 0)} passed market filters; {shadow.get('shadow_opened', 0)} virtual positions open.")
              print(f"- Shadow filter rejections: {shadow.get('rejections', {})}")
          PY

      - name: Configure GitHub Pages for the fresh dashboard data
        if: success() && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload current dashboard artifact
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard
      - name: Notify GitHub on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$NOTIFY_ISSUE" \
            --body "Trading cycle FAILED. Run #${{ github.run_number }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy-dashboard:
    needs: run-cycle
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The cycle writes live-data.js with GITHUB_TOKEN, which does not trigger a downstream push workflow.
    # Deploy the artifact from this same run so the public dashboard cannot lag behind the paper ledger.
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy latest dashboard artifact
        id: deployment
        uses: actions/deploy-pages@v5
