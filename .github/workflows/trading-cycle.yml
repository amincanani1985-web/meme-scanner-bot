name: meme scanner trading cycle

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "meme_scanner_cycle.py"
      - "tests/**"
      - ".github/workflows/trading-cycle.yml"

permissions:
  contents: write

concurrency:
  group: trading-cycle
  cancel-in-progress: false

env:
  HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
  HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Validate Python syntax
        run: python -m py_compile meme_scanner_cycle.py tests/test_scanner_logic.py

      - name: Run scanner tests 10 times
        run: |
          for i in $(seq 1 10); do
            echo "=== TEST PASS $i/10 ==="
            python -m unittest discover -s tests -p 'test_*.py' -v
          done

      - name: Run one trading cycle
        run: python meme_scanner_cycle.py

      - name: Commit updated state
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          python - <<'PY'
import json
from pathlib import Path
state=json.loads(Path("state.json").read_text())
csv=Path("trades_log.csv").read_text() if Path("trades_log.csv").exists() else ""
Path("dashboard/live-data.js").write_text(
    "window.LIVE_STATE=" + json.dumps(state, separators=(",", ":")) + ";\\n" +
    "window.LIVE_CSV=" + json.dumps(csv) + ";\\n",
    encoding="utf-8",
)
PY
          git add state.json dashboard/live-data.js
          if [ -f trades_log.csv ]; then git add trades_log.csv; fi
          if git diff --staged --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "cycle update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
