name: meme scanner trading cycle

on:
  push:
    branches: [main]
    paths:
      - "meme_scanner_cycle.py"
      - "tests/**"
      - "learn_agent.py"
      - "strategy_backtest.py"
      - ".github/workflows/trading-cycle.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: trading-cycle
  cancel-in-progress: false

env:
  NOTIFY_ISSUE: "1"
  HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
  HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Validate Python syntax
        run: python -m py_compile meme_scanner_cycle.py learn_agent.py strategy_backtest.py tests/test_scanner_logic.py tests/test_adaptive.py

      - name: Run scanner tests 10 times
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "=== TEST PASS $i/10 ==="
            python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/test.log
            grep -qE "Ran [0-9]+ tests" /tmp/test.log
          done

      - name: Run walk-forward strategy validation
        run: python strategy_backtest.py

      - name: Validate paper-trade target integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("state.json").read_text())
          trades=int(state.get("trade_count",0))
          assert 0 <= trades <= 200, f"invalid trade_count: {trades}"
          print(f"Paper-trade progress: {trades}/200")
          print("200-trade target remains data-driven; no synthetic trades are generated.")
          PY

      - name: Apply bounded adaptive strategy update
        run: python learn_agent.py --state state.json --observations strategy_observations.csv --apply

      - name: Run one trading cycle
        run: python meme_scanner_cycle.py

      - name: Commit updated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("state.json").read_text())
          csv = Path("trades_log.csv").read_text() if Path("trades_log.csv").exists() else ""
          Path("dashboard/live-data.js").write_text(
              "window.LIVE_STATE=" + json.dumps(state, separators=(",", ":")) + ";\n"
              "window.LIVE_CSV=" + json.dumps(csv) + ";\n",
              encoding="utf-8",
          )
          PY

          git add state.json dashboard/live-data.js learn_agent.py strategy_backtest.py
          if [ -f trades_log.csv ]; then git add trades_log.csv; fi
          if [ -f strategy_observations.csv ]; then git add strategy_observations.csv; fi

          if git diff --staged --quiet; then
            echo "No state changes to commit"
            exit 0
          fi

          git commit -m "cycle update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Notify GitHub on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$NOTIFY_ISSUE" \
            --body "Trading cycle succeeded. Run #${{ github.run_number }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify GitHub on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$NOTIFY_ISSUE" \
            --body "Trading cycle FAILED. Run #${{ github.run_number }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
