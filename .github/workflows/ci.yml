name: scanner CI

on:
  pull_request:
    paths:
      - "meme_scanner_cycle.py"
      - "memeswap_research.py"
      - "learn_agent.py"
      - "strategy_backtest.py"
      - "shadow_path_backtest.py"
      - "scanner_simulator.py"
      - "whale_behavior_lab.py"
      - "market_data_connectors.py"
      - "token_quality_screen.py"
      - "whale_follow_backtest.py"
      - "whale_shadow_capture.py"
      - "whale_event_study.py"
      - "tests/**"
      - "run_all_tests.py"
      - "run_tests.py"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
      - ".github/workflows/trading-cycle.yml"
      - ".github/workflows/schedule-watchdog.yml"
  push:
    branches-ignore: [main]
    paths:
      - "meme_scanner_cycle.py"
      - "memeswap_research.py"
      - "learn_agent.py"
      - "strategy_backtest.py"
      - "shadow_path_backtest.py"
      - "scanner_simulator.py"
      - "whale_behavior_lab.py"
      - "market_data_connectors.py"
      - "whale_follow_backtest.py"
      - "whale_shadow_capture.py"
      - "whale_event_study.py"
      - "tests/**"
      - "run_all_tests.py"
      - "run_tests.py"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
      - ".github/workflows/trading-cycle.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile memeswap_research.py tests/test_memeswap_research.py meme_scanner_cycle.py learn_agent.py strategy_backtest.py shadow_path_backtest.py scanner_simulator.py tests/test_scanner_simulator.py tests/test_scanner_logic.py tests/test_adaptive.py tests/test_v17_improvements.py tests/test_shadow_path_backtest.py whale_behavior_lab.py tests/test_whale_behavior_lab.py market_data_connectors.py tests/test_market_data_connectors.py token_quality_screen.py tests/test_token_quality_screen.py whale_follow_backtest.py tests/test_whale_follow_backtest.py whale_shadow_capture.py tests/test_whale_shadow_capture.py whale_event_study.py tests/test_whale_event_study.py
      - name: Run canonical test suite 10 times
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "=== TEST PASS $i/10 ==="
            python run_all_tests.py
          done
