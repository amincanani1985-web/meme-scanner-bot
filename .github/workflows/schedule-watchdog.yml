name: trading cycle schedule watchdog

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/schedule-watchdog.yml"
      - ".github/workflows/trading-cycle.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-cycle-watchdog
  # Never cancel the only scheduled health check during closely spaced commits.
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout latest paper state
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Dispatch a recovery cycle when the heartbeat is older than 7 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          age = None
          stale = True
          try:
              state = json.loads(Path("state.json").read_text(encoding="utf-8"))
              raw = state.get("last_run") if isinstance(state, dict) else None
              if raw:
                  stamp = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  if stamp.tzinfo is None:
                      stamp = stamp.replace(tzinfo=timezone.utc)
                  age = (datetime.now(timezone.utc) - stamp).total_seconds()
                  # A future heartbeat is invalid, not evidence of a healthy cycle.
                  stale = age < -60 or age > 420
          except (OSError, ValueError, TypeError, json.JSONDecodeError) as exc:
              print(f"Heartbeat unavailable or invalid ({type(exc).__name__}); treating it as stale.")
          age_text = "unknown" if age is None else f"{age:.0f}s"
          print(f"Heartbeat age: {age_text}; stale={stale} (recovery threshold: 420s)")
          Path("/tmp/heartbeat-stale").write_text("yes" if stale else "no")
          PY

          if [ "$(cat /tmp/heartbeat-stale)" != "yes" ]; then
            echo "Paper-trading heartbeat is fresh; no recovery dispatch needed."
            exit 0
          fi

          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/trading-cycle.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.name == "meme scanner trading cycle") | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$active" -gt 0 ]; then
            echo "A trading cycle is already queued or running; avoiding duplicate dispatch."
            exit 0
          fi

          gh workflow run trading-cycle.yml --ref main
          echo "Heartbeat was stale; dispatched a recovery cycle."
