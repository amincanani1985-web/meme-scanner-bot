name: Deploy dashboard to GitHub Pages
# deployment trigger 2026-09-27-node24-migration
on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build live data bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("state.json").read_text())
          csv=Path("trades_log.csv").read_text()
          Path("dashboard/live-data.js").write_text(
              "window.LIVE_STATE="+json.dumps(state,separators=(",",":"))+";\n"
              "window.LIVE_CSV="+json.dumps(csv)+";\n",
              encoding="utf-8"
          )
          PY
      - name: Inject live data bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("dashboard/index.html")
          s=p.read_text()
          s=s.replace("<script>\nconst LIVE_STATE", "<script src=\"./live-data.js\"></script><script>\nconst LIVE_STATE", 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
