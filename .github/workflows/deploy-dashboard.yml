name: Deploy trading dashboard
on:
  push:
    branches: ["main"]
    paths:
      # Source assets only. The trading-cycle workflow deploys its own fresh
      # generated data artifact, avoiding duplicate/stale Pages deployments.
      - "dashboard/market-live.js"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
