name: Deploy dashboard to GitHub Pages
# deployment trigger 2026-09-27-inline-live-data-fix
on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - "state.json"
      - "trades_log.csv"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Embed live data directly into dashboard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("state.json").read_text())
          csv=Path("trades_log.csv").read_text()
          p=Path("dashboard/index.html")
          s=p.read_text(encoding="utf-8")
          marker='<script src="./live-data.js"></script>'
          inline=(
              '<script>window.LIVE_STATE='+json.dumps(state,separators=(",",":"))+';'
              'window.LIVE_CSV='+json.dumps(csv)+';</script>'
          )
          if marker not in s:
              raise SystemExit("live-data script marker not found")
          s=s.replace(marker, inline, 1)
          s=s.replace('<div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>', '<div class="status"><span class="dot" id="dot"></span><span id="status">Loading data…</span></div>', 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
