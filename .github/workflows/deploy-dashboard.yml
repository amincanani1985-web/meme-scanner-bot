name: Deploy dashboard to GitHub Pages
# deployment trigger 2026-09-27
on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Copy live bot data
        run: |
          cp state.json dashboard/state.json
          cp trades_log.csv dashboard/trades_log.csv
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
