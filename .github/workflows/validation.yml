name: scanner validation

on:
  push:
    branches: [main]
    paths:
      - "meme_scanner_cycle.py"
      - "paper_scenario_lab.py"
      - "paper_position_monitor.py"
      - "whale_monitor.py"
      - "learn_agent.py"
      - "strategy_backtest.py"
      - "shadow_learning.py"
      - "whale_research.py"
      - "tests/**"
      - ".github/workflows/validation.yml"
  pull_request:
    paths:
      - "meme_scanner_cycle.py"
      - "paper_scenario_lab.py"
      - "paper_position_monitor.py"
      - "whale_monitor.py"
      - "learn_agent.py"
      - "strategy_backtest.py"
      - "shadow_learning.py"
      - "whale_research.py"
      - "tests/**"
      - ".github/workflows/validation.yml"

permissions:
  contents: read

concurrency:
  group: scanner-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install requests

      - name: Compile all scanner modules
        run: >-
          python -m py_compile
          meme_scanner_cycle.py paper_scenario_lab.py paper_position_monitor.py
          whale_monitor.py learn_agent.py strategy_backtest.py shadow_learning.py
          whale_research.py tests/test_scanner_logic.py tests/test_adaptive.py
          tests/test_whale_monitor.py tests/test_paper_position_monitor.py
          tests/test_workflow_safety.py tests/test_shadow_learning.py
          tests/test_whale_research.py

      - name: Run full unit suite three times
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "=== TEST PASS $i/3 ==="
            python -m unittest discover -s tests -p 'test_*.py' -v
          done
