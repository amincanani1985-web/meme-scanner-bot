name: paper profit target loop

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-profit-loop.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: paper-profit-target-loop
  cancel-in-progress: false

jobs:
  continue-until-profitable:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout latest paper state
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Continue isolated paper cycles until cumulative net profit or safety stop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/check-paper-target.py <<'PY'
          import csv
          import json
          from pathlib import Path

          try:
              state = json.loads(Path("paper_account/state.json").read_text(encoding="utf-8"))
          except (OSError, ValueError, TypeError):
              print("true state_invalid 0 0 0.000000 999999")
              raise SystemExit(0)

          ledger = Path("paper_account/trades_log.csv")
          pnls = []
          if ledger.exists() and ledger.stat().st_size:
              with ledger.open(newline="", encoding="utf-8") as handle:
                  for row in csv.DictReader(handle):
                      try:
                          pnl = float(row.get("pnl_usd", ""))
                      except (TypeError, ValueError):
                          continue
                      if pnl == pnl and abs(pnl) != float("inf"):
                          pnls.append(pnl)

          wins = sum(pnl > 0 for pnl in pnls)
          net = sum(pnls)
          risk_status = (state.get("risk_control") or {}).get("status", "unknown")
          if net > 0:
              stop, reason = True, "cumulative_net_profit"
          elif risk_status == "halted":
              stop, reason = True, "risk_halt"
          elif len(pnls) >= 200:
              stop, reason = True, "trade_cap"
          else:
              stop, reason = False, "continue"
          age_seconds = 999999
          raw = state.get("last_run")
          if raw:
              try:
                  from datetime import datetime, timezone
                  stamp = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
                  if stamp.tzinfo is None:
                      stamp = stamp.replace(tzinfo=timezone.utc)
                  age_seconds = max(0, int((datetime.now(timezone.utc) - stamp).total_seconds()))
              except (ValueError, TypeError, OverflowError):
                  age_seconds = 999999
          print(f"{'true' if stop else 'false'} {reason} {len(pnls)} {wins} {net:.6f} {age_seconds}")
          PY

          check_target() {
            python /tmp/check-paper-target.py
          }

          wait_for_cycle() {
            local previous_id="$1"
            local run_id=""
            for _ in $(seq 1 30); do
              run_id=$(gh run list --workflow trading-cycle.yml --branch main --limit 5 --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$run_id" ] && [ "$run_id" != "$previous_id" ]; then
                break
              fi
              sleep 2
            done
            if [ -z "$run_id" ] || [ "$run_id" = "$previous_id" ]; then
              echo "Could not identify the newly dispatched trading cycle; stopping safely."
              return 1
            fi
            echo "Watching trading cycle run $run_id"
            gh run watch "$run_id" --interval 10 --exit-status
          }

          for cycle in $(seq 1 10); do
            read -r stop reason trades wins net age_seconds < <(check_target)
            echo "Target check $cycle/10: reason=$reason closed=$trades wins=$wins cumulative_net_pnl=$net"
            if [ "$stop" = "true" ]; then
              echo "Stopping at safety/result gate: $reason"
              exit 0
            fi

            active_id=$(gh run list --workflow trading-cycle.yml --branch main --limit 20 --json databaseId,status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | .[0].databaseId // empty')
            if [ -n "$active_id" ]; then
              echo "Waiting for already-active trading cycle $active_id"
              gh run watch "$active_id" --interval 10 --exit-status
            else
              previous_id=$(gh run list --workflow trading-cycle.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              echo "Dispatching isolated paper cycle $cycle/10"
              gh workflow run trading-cycle.yml --ref main
              wait_for_cycle "$previous_id"
            fi

            git fetch origin main
            git reset --hard origin/main
            read -r stop reason trades wins net age_seconds < <(check_target)
            echo "After cycle $cycle/10: reason=$reason closed=$trades wins=$wins cumulative_net_pnl=$net"
            if [ "$stop" = "true" ]; then
              echo "Stopping at safety/result gate: $reason"
              exit 0
            fi

            if [ "$cycle" -lt 10 ]; then
              sleep 240
              git fetch origin main
              git reset --hard origin/main
            fi
          done

          echo "Reached 10-cycle test limit without cumulative net profit. Paper trading only; no live orders were sent."
