<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meme Scanner Dashboard</title><style>body{margin:0;background:#071018;color:#e8f0f5;font:14px system-ui;padding:20px}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#0d1822;border:1px solid #20303d;border-radius:14px;padding:16px}.label{color:#8da0ad}.value{font-size:24px;font-weight:700;margin-top:6px}.green{color:#39d98a}.red{color:#ff647c}.bar{height:10px;background:#16242f;border-radius:9px;overflow:hidden}.fill{height:100%;background:#39d98a;width:0}.table{width:100%;border-collapse:collapse;margin-top:10px}.table td,.table th{padding:9px;border-bottom:1px solid #20303d;text-align:left}.table th{color:#8da0ad}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><main><h1>🧪 Meme Scanner — Paper Trading</h1><p id="status">Loading…</p><div class="grid"><div class="card"><div class="label">Equity</div><div class="value" id="equity">—</div></div><div class="card"><div class="label">P&L</div><div class="value" id="pnl">—</div></div><div class="card"><div class="label">Trades</div><div class="value" id="trades">—</div></div><div class="card"><div class="label">Positions</div><div class="value" id="positions">—</div></div><div class="card"><div class="label">Scans</div><div class="value" id="scans">—</div></div></div><div class="card" style="margin-top:12px"><div>100-trade progress <span id="pct"></span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="card" style="margin-top:12px"><h2>Open positions</h2><table class="table"><thead><tr><th>Symbol</th><th>Entry</th><th>Peak</th><th>Liquidity</th><th>Trailing</th></tr></thead><tbody id="open"></tbody></table></div><div class="card" style="margin-top:12px"><h2>Closed trades</h2><table class="table"><thead><tr><th>Time</th><th>Symbol</th><th>P&L %</th><th>P&L $</th><th>Reason</th></tr></thead><tbody id="closed"></tbody></table></div></main><script>
const B='https://raw.githubusercontent.com/amincanani1985-web/meme-scanner-bot/main/';const E=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const M=x=>'$'+Number(x).toFixed(2);const P=x=>Number(x).toExponential(4);
async function load(){try{const [a,b]=await Promise.all([fetch(B+'state.json?t='+Date.now()),fetch(B+'trades_log.csv?t='+Date.now())]);const s=await a.json();const csv=await b.text();const rows=csv.trim().split(/\r?\n/).slice(1).map(x=>{const p=x.split(',');return{t:p[0],sym:p[2],pct:p[5],usd:p[6],reason:p[8]}}).filter(x=>x.sym);const pnl=Number(s.equity)-1000,n=Number(s.trade_count)||0;equity.textContent=M(s.equity);pnlEl.textContent=(pnl>=0?'+':'')+M(pnl);pnlEl.className='value '+(pnl>=0?'green':'red');trades.textContent=n+'/100';positions.textContent=Object.keys(s.positions||{}).length;scans.textContent=s.scan_count||0;const q=Math.min(100,n);pct.textContent=q+'%';fill.style.width=q+'%';status.textContent=n>=100?'100 TRADES COMPLETE':'RUNNING • PAPER';open.innerHTML=Object.values(s.positions||{}).map(p=>'<tr><td>'+E(p.symbol)+'</td><td>'+P(p.entry_price)+'</td><td>'+P(p.peak_price)+'</td><td>'+M(p.entry_liquidity)+'</td><td>'+(p.trailing_active?'ON':'off')+'</td></tr>').join('')||'<tr><td colspan=5>No open positions</td></tr>';closed.innerHTML=rows.reverse().map(r=>'<tr><td>'+E(r.t)+'</td><td>'+E(r.sym)+'</td><td>'+Number(r.pct).toFixed(2)+'%</td><td>'+M(r.usd)+'</td><td>'+E(r.reason)+'</td></tr>').join('')||'<tr><td colspan=5>No closed trades</td></tr>'}catch(e){status.textContent='DATA ERROR'}}load();setInterval(load,60000);</script></body></html>
